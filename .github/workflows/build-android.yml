name: Build Android APK

on:
  push:
    branches:
      - master
      - feature/phase2-mobile-rn
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install mobile dependencies
        run: cd packages/mobile && pnpm install

      - name: Debug - Check directory structure
        run: |
          echo "=== Root node_modules structure ==="
          ls -la node_modules/@react-native/ 2>/dev/null || echo "No @react-native in root"
          echo ""
          echo "=== Mobile node_modules structure ==="
          ls -la packages/mobile/node_modules/@react-native/ 2>/dev/null || echo "No @react-native in mobile"
          echo ""
          echo "=== Check gradle-plugin specifically ==="
          ls -la packages/mobile/node_modules/@react-native/gradle-plugin 2>/dev/null || echo "gradle-plugin NOT FOUND in mobile/node_modules"
          ls -la node_modules/@react-native/gradle-plugin 2>/dev/null || echo "gradle-plugin NOT FOUND in root/node_modules"
          echo ""
          echo "=== Check if it's a symlink ==="
          file packages/mobile/node_modules/@react-native/gradle-plugin 2>/dev/null || echo "Path does not exist"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          cd packages/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
